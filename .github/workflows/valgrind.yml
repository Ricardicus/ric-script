name: Memory leakage detection

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  valgrind:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install build tools and Valgrind
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential flex bison valgrind libcurl4-openssl-dev
    - name: Build project
      run: make
    - name: Check every supported sample
      run: python3 scripts/check_sample_memory.py --tool valgrind
    - name: Save per-sample memory reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: sample-memory-reports
        path: memory-reports/*.log
